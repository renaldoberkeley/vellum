services:
  postgres:
    image: postgres:16-alpine
    container_name: vellum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vellum
      POSTGRES_PASSWORD: vellum
      POSTGRES_DB: vellum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
